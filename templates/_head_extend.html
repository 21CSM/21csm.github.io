{% if config.generate_feeds %}
<link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path="feed.xml", trailing_slash=false) }}">
{% endif %}
{% if page is defined %}
<link rel="canonical" href="{{ page.permalink | safe }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description | default(value=config.description) }}">
<meta property="og:url" content="{{ page.permalink | safe }}">
<meta property="og:type" content="article">
{% elif term is defined %}
<link rel="canonical" href="{{ term.permalink | safe }}">
<meta property="og:title" content="# {{ term.name }}">
<meta property="og:description" content="{{ config.description }}">
<meta property="og:url" content="{{ term.permalink | safe }}">
<meta property="og:type" content="website">
{% elif taxonomy is defined %}
<link rel="canonical" href="{{ get_url(path=taxonomy.name, trailing_slash=true) | safe }}">
<meta property="og:title" content="{{ taxonomy.name | capitalize }}">
<meta property="og:description" content="{{ config.description }}">
<meta property="og:url" content="{{ get_url(path=taxonomy.name, trailing_slash=true) | safe }}">
<meta property="og:type" content="website">
{% elif section is defined and section.components | length == 0 %}
<link rel="canonical" href="{{ section.permalink | safe }}">
<meta property="og:title" content="{{ config.title }}">
<meta property="og:description" content="{{ config.description }}">
<meta property="og:url" content="{{ section.permalink | safe }}">
<meta property="og:type" content="website">
{% elif section is defined %}
<link rel="canonical" href="{{ section.permalink | safe }}">
<meta property="og:title" content="{{ section.title | default(value=config.title) }}">
<meta property="og:description" content="{{ section.description | default(value=config.description) }}">
<meta property="og:url" content="{{ section.permalink | safe }}">
<meta property="og:type" content="website">
{% else %}
<link rel="canonical" href="{{ config.base_url | safe }}">
<meta property="og:title" content="{{ config.extra.not_found_title | default(value=config.title) }}">
<meta property="og:description" content="{{ config.description }}">
<meta property="og:url" content="{{ config.base_url | safe }}">
<meta property="og:type" content="website">
{% endif %}
<meta property="og:site_name" content="{{ config.title }}">
<meta property="og:image" content="{{ get_url(path=config.extra.avatar, trailing_slash=false) }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="{{ get_url(path=config.extra.avatar, trailing_slash=false) }}">
