name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  flake-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check flake health
        uses: DeterminateSystems/flake-checker-action@v14
        with:
          fail-mode: true

  build:
    runs-on: ubuntu-latest
    needs: flake-health-check
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - name: Build with Nix
        run: nix build '.?submodules=1#'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./result

  deploy-production:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
