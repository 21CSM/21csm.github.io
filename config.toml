# serene v6.0.0
#
# - docs: https://github.com/isunjn/serene/blob/v6.0.0/USAGE.md
# - check for updates: https://github.com/isunjn/serene/releases
#
#=========================================================================================

base_url = "https://21csm.github.io"
title = "21CSM"
description = "Writings by 21CSM"
default_language = "en"
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = false
build_search_index = false            # Keep this false, search is temporarily unsupported
generate_feeds = true                 # Root feed stays at /feed.xml
feed_filenames = ["feed.xml"]
taxonomies = [{ name = "tags" }, { name = "categories" }]
# The collection data is read at build time. Don't also publish it.
ignored_content = ["projects/projects.toml"]

[markdown]
render_emoji = false
external_links_target_blank = false
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

#=========================================================================================

[extra]

nav = [
    { name = "blog", path = "/blog" },
    { name = "projects", path = "/projects" },
]

name = "dev"
handle = "21CSM"
bio = "On Technology"
avatar = "img/avatar.webp"
links = [
    { name = "GitHub", icon = "github", url = "https://github.com/21CSM" },
]

blog_section_path = "/blog"
back_link_text = "Back"
color_scheme = "light"
og_image = "img/avatar.webp"

# Keep the previous numeric dates (2024-09-11) rather than Serene's "Sep 11, 2024" default.
date_format = "%Y-%m-%d"

toc = true
code_copy = true
comment = true
math = false
mermaid = false
outdated_alert = false
outdated_alert_days = 120
outdated_alert_text_before = "This article was last updated "
outdated_alert_text_after = " days ago and may be out of date."

footer_copyright = "© 2026 21CSM"
footer_credits = true

not_found_error_text = "Not Found"
not_found_recover_text = "« back to home »"
